[build]
  command = "curl -fsSL https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/dart.gpg && echo 'deb [signed-by=/usr/share/keyrings/dart.gpg arch=amd64] https://storage.googleapis.com/download.dartlang.org/linux/debian stable main' | sudo tee /etc/apt/sources.list.d/dart_stable.list > /dev/null && sudo apt-get update -q && sudo apt-get install -y dart && export PATH=\"$PATH:/usr/lib/dart/bin:$HOME/.pub-cache/bin\" && dart pub global activate jaspr_cli && jaspr build"
  publish = "build/jaspr/"
